name: Android APK

# android/ 가 바뀌면 디버그 APK 를 빌드해 Actions 아티팩트로 올린다. 서버 배포(deploy.yml)와는 별개.
on:
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Firebase 설정은 저장소에 두지 않고 Secrets(GOOGLE_SERVICES_JSON)에서 빌드 때만 만든다. 없으면 FCM 없이 빌드된다.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret 없음 - FCM 없이 빌드"
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      # 빌드 로그는 로그인해야 보이므로, 실패 원인을 공개 API 로 읽을 수 있는 annotation 으로 남긴다.
      - name: Report build errors as annotations
        if: failure()
        working-directory: android
        run: |
          grep -E '^e: |error:|What went wrong|^> |Could not|Unresolved|Exception' build.log \
            | sed -e 's#file:///home/runner/work/[^ ]*/android/##' \
            | awk '!seen[$0]++' | head -45 > errors.txt || true
          split -l 5 errors.txt chunk_ || true
          for f in chunk_*; do
            [ -f "$f" ] || continue
            msg=$(sed -e 's/%/%25/g' "$f" | awk 'BEGIN{ORS="%0A"} {print}')
            echo "::error title=android build::${msg}"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: assistant-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
