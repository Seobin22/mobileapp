name: Deploy to DigitalOcean

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAR_NAME: phonedrop-0.0.1-SNAPSHOT.jar
      REMOTE_DIR: /root
      SERVICE: phonedrop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build jar
        run: |
          chmod +x mvnw
          ./mvnw -B package -DskipTests
          test -f "target/$JAR_NAME"

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload jar as temporary file
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "target/$JAR_NAME" "$SSH_USER@$SSH_HOST:$REMOTE_DIR/$JAR_NAME.new"

      - name: Backup, swap, restart, verify
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PORT: ${{ secrets.SERVER_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<EOF
          set -euo pipefail
          cd "$REMOTE_DIR"
          test -s "$JAR_NAME.new"
          if [ -f "$JAR_NAME" ]; then cp -p "$JAR_NAME" "$JAR_NAME.bak"; fi
          mv -f "$JAR_NAME.new" "$JAR_NAME"
          systemctl restart "$SERVICE"
          for i in 1 2 3 4 5 6; do
            sleep 5
            if ! systemctl is-active --quiet "$SERVICE"; then
              echo "Service $SERVICE is not active (check \$i)"
              journalctl -u "$SERVICE" -n 50 --no-pager
              exit 1
            fi
          done
          echo "Service $SERVICE is active"
          for i in \$(seq 1 12); do
            if curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:8080/; then
              echo "HTTP check passed"
              exit 0
            fi
            sleep 5
          done
          echo "HTTP check failed: http://127.0.0.1:8080/ did not respond"
          journalctl -u "$SERVICE" -n 50 --no-pager
          exit 1
          EOF

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
