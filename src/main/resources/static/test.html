<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실행 비서 관리</title>
    <style>
        :root { --bg: #fff4f7; --card: #fff; --line: #f0d3dc; --text: #2b2024; --muted: #8a7178; --accent: #d6336c; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: sans-serif; background: var(--bg); color: var(--text); }
        main { max-width: 880px; margin: 0 auto; padding: 16px; }
        h1 { font-size: 1.4rem; margin: 8px 0 16px; }
        h2 { font-size: 1.05rem; margin: 0 0 10px; }
        section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 14px; }
        label { display: block; font-size: .85rem; color: var(--muted); margin: 6px 0 2px; }
        input, textarea { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
        textarea { min-height: 70px; font-family: monospace; font-size: .85rem; }
        button { padding: 8px 12px; border: 0; border-radius: 6px; background: var(--accent); color: #fff; font: inherit; cursor: pointer; }
        button.ghost { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
        .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
        .muted { color: var(--muted); font-size: .85rem; }
        .error { color: #c92a2a; margin-top: 6px; min-height: 1.2em; }
        table { width: 100%; border-collapse: collapse; font-size: .9rem; }
        td, th { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
        .badge { display: inline-block; padding: 1px 7px; border-radius: 10px; background: #f8e1e8; font-size: .8rem; }
        .running { background: #ffe3e3; border-color: #ff8787; }
        pre { white-space: pre-wrap; word-break: break-all; font-size: .8rem; margin: 0; }
        .actions button { margin: 0 4px 4px 0; padding: 4px 8px; font-size: .8rem; }
    </style>
</head>
<body>
<main>
    <h1>실행 비서 관리 <span class="muted">v3 · 협상·동행·먼저 말 걸기·대신 처리</span></h1>

    <section id="tokenBox">
        <h2>API 토큰</h2>
        <p class="muted">서버의 <code>/root/data/assistant/api_token</code> 값. 이 브라우저에만 저장됩니다.</p>
        <div class="row">
            <input id="token" type="password" placeholder="API 토큰" autocomplete="off">
            <button id="saveToken">저장</button>
        </div>
        <div class="error" id="tokenError"></div>
    </section>

    <section id="statusBox">
        <h2>지금 상태 <button class="ghost" id="refresh" style="float:right">새로고침</button></h2>
        <div id="status" class="muted">토큰을 저장하면 표시됩니다.</div>
    </section>

    <section>
        <h2>AI 연결</h2>
        <div id="agent" class="muted">-</div>
        <label>Anthropic API 키 (서버 /root/data/assistant/anthropic_api_key 에 저장, 다시 표시하지 않음)</label>
        <div class="row">
            <input id="apiKey" type="password" placeholder="sk-ant-..." autocomplete="off">
            <button id="saveKey">키 저장</button>
        </div>
        <div class="error" id="keyError"></div>
    </section>

    <section>
        <h2>채팅 <button class="ghost" id="reloadChat" style="float:right">새로고침</button></h2>
        <div id="chat" style="max-height:420px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fffafc">-</div>
        <div class="row" style="margin-top:8px">
            <input id="chatInput" placeholder="예: 금요일까지 보고서 써야 해">
            <button id="send">보내기</button>
        </div>
        <div class="error" id="chatError"></div>
    </section>

    <section>
        <h2>먼저 말 걸기 · 작업물 <button class="ghost" id="reloadProactive" style="float:right">새로고침</button></h2>
        <div id="proactive" class="muted">-</div>
        <div id="workProduct" style="display:none;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fffafc"></div>
    </section>

    <section>
        <h2>시간표 (오늘부터 7일)</h2>
        <div id="timeline" class="muted">-</div>
    </section>

    <section>
        <h2>할 일 추가 <span class="muted">(수동 등록)</span></h2>
        <div class="row">
            <div><label>제목</label><input id="title" placeholder="보고서 초안"></div>
            <div><label>첫 행동</label><input id="firstAction" placeholder="문서 파일만 열기"></div>
        </div>
        <div class="row">
            <div><label>시작</label><input id="start" type="datetime-local"></div>
            <div><label>길이(분)</label><input id="duration" type="number" value="30" min="5"></div>
        </div>
        <p><button id="add">추가</button> <button class="ghost" id="inTwo">2분 뒤로 채우기</button></p>
        <div class="error" id="addError"></div>
    </section>

    <section>
        <h2>오늘부터 7일</h2>
        <div id="tasks" class="muted">-</div>
        <div class="error" id="taskError"></div>
    </section>

    <section>
        <h2>생활 설정</h2>
        <div class="row">
            <div><label>기상</label><input id="wake" placeholder="07:30"></div>
            <div><label>취침</label><input id="sleep" placeholder="23:30"></div>
        </div>
        <label>방해 금지(JSON, 요일 월=1)</label>
        <textarea id="dnd">[]</textarea>
        <p><button id="saveSettings">설정 저장</button></p>
        <div class="error" id="settingsError"></div>
    </section>

    <section>
        <h2>최근 푸시 <span class="muted" id="pushMode"></span></h2>
        <div id="pushes" class="muted">-</div>
    </section>
</main>

<script>
    // 서버에서 연 페이지면 같은 주소, 파일 미리보기(file:// 등)로 열었으면 운영 서버로 보낸다.
    const BASE = (location.protocol === 'http:' || location.protocol === 'https:')
        ? location.origin + '/api/assistant'
        : 'https://test.seobin.page/api/assistant';
    const $ = id => document.getElementById(id);

    // 브라우저 저장이 막혀 있어도(사생활 보호 모드 등) 이 탭에서는 쓰도록 메모리에도 둔다.
    let memoryToken = '';
    function getToken() {
        try { return localStorage.getItem('assistantToken') || memoryToken; } catch (e) { return memoryToken; }
    }

    async function api(method, path, body) {
        const res = await fetch(BASE + path, {
            method,
            headers: { 'Authorization': 'Bearer ' + getToken(), 'Content-Type': 'application/json' },
            body: body === undefined ? undefined : JSON.stringify(body)
        });
        const text = await res.text();
        const data = text ? JSON.parse(text) : {};
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        return data;
    }

    function esc(s) {
        return String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    }

    function hm(iso) {
        return iso ? iso.substring(5, 16).replace('T', ' ') : '';
    }

    function localInputToIso(value) {
        // datetime-local 은 브라우저 시간대. 오프셋을 붙여 보낸다.
        const d = new Date(value);
        const off = -d.getTimezoneOffset();
        const sign = off >= 0 ? '+' : '-';
        const pad = n => String(Math.abs(n)).padStart(2, '0');
        return value + ':00' + sign + pad(Math.trunc(off / 60)) + ':' + pad(off % 60);
    }

    function toLocalInput(date) {
        const pad = n => String(n).padStart(2, '0');
        return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate())
            + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes());
    }

    async function loadStatus() {
        const s = await api('GET', '/v1/admin/status');
        const running = s.running_interventions.map(i =>
            `<div class="running" style="border:1px solid;padding:8px;border-radius:6px;margin:6px 0">
                개입 #${i.id} (블록 #${i.block_id}, L${i.level}) ${hm(i.started_at)} 시작
                ${i.status === 'negotiating'
                    ? `<span class="badge">협상 중 · ${hm(i.negotiate_until).substring(6)}까지 답이 없으면 화면 재등장</span>` : ''}
                <button data-start="${i.id}" data-block="${i.block_id}">휴대폰 대신 [시작] 보내기</button>
                ${i.status === 'running'
                    ? `<button class="ghost" data-snooze="${i.id}" data-block="${i.block_id}">[미루기 요청] 보내기</button>` : ''}
             </div>`).join('');
        const devices = s.devices.length ? s.devices.map(d =>
            `기기 #${d.id} ${esc(d.app_version)} · 마지막 하트비트 ${hm(d.last_heartbeat)} · <code>${esc(JSON.stringify(d.capabilities))}</code>`
        ).join('<br>') : '등록된 기기 없음';
        const jobs = s.scheduled_jobs.map(j => `${hm(j.fire_at)} ${j.type} #${j.target_id}`).join('<br>') || '없음';
        $('status').innerHTML = `
            <div>서버 시각 ${hm(s.now)} · plan_version ${s.plan_version} · ${s.quiet_now ? '조용한 시간' : '활동 시간'}</div>
            ${running || '<div>진행 중 개입 없음</div>'}
            <div style="margin-top:6px">${devices}</div>
            <details style="margin-top:6px"><summary>예약 작업</summary><div>${jobs}</div></details>`;
        $('pushMode').textContent = s.push_mode === 'fake'
            ? '(FCM 미설정: 실제로 보내지 않고 기록만 함)' : '(Firebase 발송)';
        $('pushes').innerHTML = s.recent_pushes.length ? '<table>' + s.recent_pushes.map(p => {
            const { at, delivered, type, ...rest } = p;
            return `<tr><td>${hm(at)}</td><td><span class="badge">${esc(type)}</span></td><td>${esc(delivered)}</td>
                    <td><pre>${esc(JSON.stringify(rest))}</pre></td></tr>`;
        }).join('') + '</table>' : '아직 없음 (서버 재시작 시 비워짐)';
    }

    async function loadTasks() {
        const data = await api('GET', '/v1/admin/tasks');
        if (!data.tasks.length) { $('tasks').textContent = '없음'; return; }
        $('tasks').innerHTML = '<table><tr><th>시각</th><th>할 일</th><th>상태</th><th></th></tr>' + data.tasks.map(t => {
            const b = t.blocks.filter(x => x.status !== 'cancelled').at(-1) || t.blocks.at(-1) || {};
            return `<tr><td>${hm(b.start)}–${(b.end || '').substring(11, 16)}</td>
                <td><b>${esc(t.title)}</b><br><span class="muted">${esc(t.first_action)}</span></td>
                <td><span class="badge">${esc(t.status)}</span> <span class="badge">${esc(b.status)}</span></td>
                <td class="actions">${t.status === 'active'
                    ? `<button class="ghost" data-edit="${t.id}" data-start-at="${esc(b.start)}" data-duration="${t.est_minutes}">시각 변경</button>
                       <button class="ghost" data-delete="${t.id}">삭제</button>` : ''}</td></tr>`;
        }).join('') + '</table>';
    }

    async function loadSettings() {
        const s = (await api('GET', '/v1/settings')).settings;
        $('wake').value = s['life.wake'];
        $('sleep').value = s['life.sleep'];
        $('dnd').value = JSON.stringify(s['dnd.windows']);
    }

    async function loadAgent() {
        const a = await api('GET', '/v1/admin/agent');
        const turns = a.recent_turns.map(t => `#${t.id} ${esc(t.trigger)} <span class="badge">${esc(t.status)}</span>`
            + ` 도구 ${t.tool_calls} · 토큰 ${t.input_tokens ?? '-'}/${t.output_tokens ?? '-'}`
            + (t.error ? ` <span style="color:#c92a2a">${esc(t.error)}</span>` : '')).join('<br>') || '아직 없음';
        $('agent').innerHTML = `모델 <b>${esc(a.model || '(없음)')}</b> · API 키 ${a.api_key_configured ? '✅ 설정됨' : '❌ 없음'}`
            + ` · 오늘 turn ${a.turns_today}<details style="margin-top:6px"><summary>최근 turn</summary>${turns}</details>`;
    }

    async function loadChat() {
        const data = await api('GET', '/v1/messages');
        const box = $('chat');
        box.innerHTML = data.messages.map(m => {
            const mine = m.role === 'user';
            let extra = '';
            if (m.kind === 'question' && m.options && m.question_status === 'open') {
                extra = '<div style="margin-top:4px">' + m.options.map(o =>
                    `<button class="ghost" data-answer="${esc(o)}" data-qid="${m.question_id}" style="margin:2px">${esc(o)}</button>`).join('') + '</div>';
            }
            if (m.kind === 'confirmation') {
                extra = m.confirmation_status === 'pending'
                    ? `<div style="margin-top:4px"><button data-confirm="${m.confirmation_id}" data-accept="true">예</button>
                       <button class="ghost" data-confirm="${m.confirmation_id}" data-accept="false">아니오</button></div>`
                    : `<div class="muted">확인 카드: ${esc(m.confirmation_status)}</div>`;
            }
            return `<div style="text-align:${mine ? 'right' : 'left'};margin:6px 0">
                <div style="display:inline-block;max-width:85%;text-align:left;padding:7px 10px;border-radius:10px;
                    background:${mine ? '#d6336c' : '#fff'};color:${mine ? '#fff' : 'inherit'};border:1px solid var(--line);white-space:pre-wrap">${esc(m.content)}${extra}</div>
                <div class="muted" style="font-size:.7rem">${hm(m.created_at)} ${m.kind !== 'reply' ? esc(m.kind) : ''}${m.silent ? ' · 🔕 알림 없음' : ''}${m.importance === 'high' ? ' · ❗high' : ''}</div></div>`;
        }).join('') || '<span class="muted">대화가 없습니다</span>';
        box.scrollTop = box.scrollHeight;
        for (const m of data.messages) {
            if (m.role === 'assistant' && !m.read) api('POST', '/v1/messages/' + m.id + '/read').catch(() => {});
        }
    }

    async function loadProactive() {
        const p = await api('GET', '/v1/admin/proactive');
        const wakeups = p.wakeups.map(w => `${hm(w.fire_at)} <span class="badge">${esc(w.status)}</span> `
            + `#${w.id} ${esc(w.reason)}${w.task_title ? ' · ' + esc(w.task_title) : ''}`).join('<br>') || '없음';
        const flags = p.daily_flags.map(f => `${esc(f.logical_day)} 아침 ${f.morning_done ? '✅' : '–'} 저녁 ${f.evening_done ? '✅' : '–'}`)
            .join('<br>') || '아직 없음';
        const products = p.work_products.map(w => `<button class="ghost" data-wp="${w.id}" style="margin:2px">#${w.id} ${esc(w.title)}</button>`
            + ` <span class="muted">${esc(w.kind)}${w.block_id ? ' · 블록#' + w.block_id + ' 첨부' : ''} · ${hm(w.created_at)}</span>`).join('<br>') || '없음';
        $('proactive').innerHTML = `
            <div>오늘 먼저 보낸 메시지 <b>${p.messages_today}</b> / ${p.daily_budget} · high 알림 ${p.high_today} / ${p.high_per_day}
                · 오늘 turn ${p.turns_today} / ${p.turn_soft_limit}(넘으면 pulse·웹 검색·작업물 중지)</div>
            <div style="margin-top:6px"><b>예약된 wakeup</b><br>${wakeups}</div>
            <div style="margin-top:6px"><b>아침·저녁</b><br>${flags}</div>
            <div style="margin-top:6px"><b>작업물</b><br>${products}</div>`;
    }

    async function showWorkProduct(id) {
        const w = await api('GET', '/v1/work_products/' + id);
        const sources = (w.sources || []).map(s => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title || s.url)}</a></li>`).join('');
        $('workProduct').style.display = 'block';
        $('workProduct').innerHTML = `<b>#${w.id} ${esc(w.title)}</b> <span class="badge">${esc(w.kind)}</span>
            <button class="ghost" data-wp-close="1" style="float:right">닫기</button>
            <pre style="margin-top:8px;font-size:.85rem">${esc(w.content_md)}</pre>
            ${sources ? '<div class="muted" style="margin-top:6px">출처</div><ul>' + sources + '</ul>' : ''}`;
    }

    async function loadTimeline() {
        const t = await api('GET', '/v1/timeline');
        const label = { event: '일정', block: '블록', quiet: '방해금지', meal: '식사', free: '빈 시간' };
        $('timeline').innerHTML = t.days.map(d => `<div style="margin:6px 0"><b>${esc(d.date)}</b><br>` + d.items
            .filter(i => i.kind !== 'free')
            .map(i => `${i.start.substring(11, 16)}–${i.end.substring(11, 16)} <span class="badge">${label[i.kind]}</span> `
                + `${esc(i.title || '')}${i.status ? ' · ' + esc(i.status) : ''}`
                + (i.work_product_id ? ` <button class="ghost" data-wp="${i.work_product_id}" style="padding:1px 6px;font-size:.75rem">작업물</button>` : ''))
                .join('<br>') + '</div>').join('')
            || '없음';
    }

    async function sendChat(text, answeredQuestionId) {
        $('chatError').textContent = '';
        await api('POST', '/v1/messages', {
            client_msg_id: crypto.randomUUID(), text, source: 'chat', answered_question_id: answeredQuestionId || null
        });
        await loadChat();
        // 비서 답은 몇 초 뒤에 온다
        for (const delay of [3000, 6000, 12000, 20000]) setTimeout(() => { loadChat().catch(() => {}); loadTimeline().catch(() => {}); }, delay);
    }

    async function refreshAll() {
        $('tokenError').textContent = '';
        try {
            await Promise.all([loadStatus(), loadTasks(), loadAgent(), loadChat(), loadTimeline(), loadProactive()]);
        } catch (e) {
            $('tokenError').textContent = e.message;
        }
    }

    $('saveKey').onclick = async () => {
        $('keyError').textContent = '';
        try {
            await api('POST', '/v1/admin/anthropic_key', { key: $('apiKey').value.trim() });
            $('apiKey').value = '';
            await loadAgent();
            $('keyError').textContent = '저장했습니다';
        } catch (e) { $('keyError').textContent = e.message; }
    };
    $('send').onclick = async () => {
        const text = $('chatInput').value.trim();
        if (!text) return;
        $('chatInput').value = '';
        try { await sendChat(text); } catch (e) { $('chatError').textContent = e.message; }
    };
    $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) $('send').click(); });
    $('reloadChat').onclick = () => loadChat().catch(e => $('chatError').textContent = e.message);
    $('reloadProactive').onclick = () => loadProactive().catch(e => $('proactive').textContent = e.message);

    $('saveToken').onclick = async () => {
        // 웹 콘솔에서 복사할 때 섞이는 공백·줄바꿈을 모두 지운다
        memoryToken = $('token').value.replace(/\s+/g, '');
        $('token').value = memoryToken;
        try { localStorage.setItem('assistantToken', memoryToken); } catch (e) { /* 저장 불가: 메모리 값으로 계속 */ }
        await refreshAll();
        try { await loadSettings(); } catch (e) { /* refreshAll 이 오류를 보여준다 */ }
    };
    $('refresh').onclick = refreshAll;

    $('inTwo').onclick = () => {
        $('start').value = toLocalInput(new Date(Date.now() + 2 * 60000 + 60000 - Date.now() % 60000));
        if (!$('title').value) $('title').value = '테스트 블록';
        if (!$('firstAction').value) $('firstAction').value = '휴대폰 화면 확인하기';
    };

    $('add').onclick = async () => {
        $('addError').textContent = '';
        try {
            await api('POST', '/v1/admin/tasks', {
                title: $('title').value, first_action: $('firstAction').value,
                start: localInputToIso($('start').value), duration_min: Number($('duration').value)
            });
            $('title').value = ''; $('firstAction').value = '';
            await refreshAll();
        } catch (e) { $('addError').textContent = e.message; }
    };

    document.addEventListener('click', async ev => {
        const el = ev.target;
        $('taskError').textContent = '';
        try {
            if (el.dataset.answer) {
                await sendChat(el.dataset.answer, Number(el.dataset.qid));
                return;
            }
            if (el.dataset.wp) {
                await showWorkProduct(el.dataset.wp);
                return;
            }
            if (el.dataset.wpClose) {
                $('workProduct').style.display = 'none';
                return;
            }
            if (el.dataset.confirm) {
                await api('POST', '/v1/confirmations/' + el.dataset.confirm, { accept: el.dataset.accept === 'true' });
                await loadChat();
                for (const delay of [3000, 8000, 15000]) setTimeout(() => loadChat().catch(() => {}), delay);
                return;
            }
            if (el.dataset.delete) {
                if (!confirm('이 할 일을 삭제할까요?')) return;
                await api('DELETE', '/v1/admin/tasks/' + el.dataset.delete);
            } else if (el.dataset.edit) {
                const current = (el.dataset.startAt || '').substring(0, 16);
                const start = prompt('새 시작 시각 (YYYY-MM-DDTHH:MM)', current);
                if (!start) return;
                const duration = prompt('길이(분)', el.dataset.duration);
                await api('PATCH', '/v1/admin/tasks/' + el.dataset.edit,
                    { start: localInputToIso(start), duration_min: Number(duration) });
            } else if (el.dataset.snooze) {
                await api('POST', '/v1/actions', {
                    idempotency_key: crypto.randomUUID(), type: 'snooze_request',
                    intervention_id: Number(el.dataset.snooze), block_id: Number(el.dataset.block),
                    client_at: new Date().toISOString()
                });
                for (const delay of [3000, 8000, 15000]) setTimeout(() => loadChat().catch(() => {}), delay);
            } else if (el.dataset.start) {
                await api('POST', '/v1/actions', {
                    idempotency_key: crypto.randomUUID(), type: 'start',
                    intervention_id: Number(el.dataset.start), block_id: Number(el.dataset.block),
                    client_at: new Date().toISOString()
                });
            } else {
                return;
            }
            await refreshAll();
        } catch (e) { $('taskError').textContent = e.message; }
    });

    $('saveSettings').onclick = async () => {
        $('settingsError').textContent = '';
        try {
            await api('PUT', '/v1/settings', { key: 'life.wake', value: $('wake').value.trim() });
            await api('PUT', '/v1/settings', { key: 'life.sleep', value: $('sleep').value.trim() });
            await api('PUT', '/v1/settings', { key: 'dnd.windows', value: JSON.parse($('dnd').value || '[]') });
            await refreshAll();
            $('settingsError').textContent = '저장했습니다';
        } catch (e) { $('settingsError').textContent = e.message; }
    };

    $('token').value = getToken();
    if (getToken()) { refreshAll(); loadSettings().catch(() => {}); }
    setInterval(() => { if (getToken()) { loadStatus().catch(() => {}); loadChat().catch(() => {}); } }, 15000);
</script>
</body>
</html>
