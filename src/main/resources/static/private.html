<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 저장소</title>
    <!-- 홈 화면에 추가하면 안드로이드 공유 메뉴에 "내 저장소"가 뜬다(share_target). -->
    <link rel="manifest" href="/private.webmanifest">
    <meta name="theme-color" content="#1c7ed6">
    <link rel="icon" href="/icons/private-192.png">

    <style>
        body { max-width: 800px; margin: 30px auto; padding: 0 16px; font-family: sans-serif; }
        section { margin-bottom: 28px; }
        input { padding: 6px; margin: 4px 0; }
        .hint { color: #666; font-size: 0.9em; }
        .error { color: #c92a2a; min-height: 1.2em; }
        .ok { color: #2b8a3e; min-height: 1.2em; }
        .hidden { display: none; }
        #dropZone { border: 2px dashed #aaa; border-radius: 8px; padding: 24px; text-align: center; color: #666; margin: 8px 0; }
        #dropZone.over { border-color: #1c7ed6; background: #e7f5ff; }
        ul { list-style: none; padding: 0; }
        li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
             padding: 8px 0; border-bottom: 1px solid #eee; }
        .name { overflow-wrap: anywhere; }
        .actions { flex: none; }
        .actions button { margin: 2px 0 2px 4px; }
        .bundle { display: block; }
        .bundle > .row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
        .bundle > .row > .actions { flex: 0 1 auto; }
        .bundle ul { margin: 6px 0 0 16px; }
        .bundle li { padding: 6px 0; }
        #shareBox { border: 2px solid #1c7ed6; border-radius: 8px; padding: 12px; margin: 8px 0; background: #e7f5ff; }
        #shareBox button { margin: 4px 4px 0 0; }
    </style>
</head>

<body>
    <h1>🔒 내 저장소</h1>
    <p><a href="/">메인으로</a> · <span class="hint">여기 올린 파일은 본인만 보고 받을 수 있습니다. 메인 화면 공개 목록에는 나오지 않습니다.</span></p>

    <section id="loginBox" class="hidden">
        <h2>로그인</h2>
        <form id="loginForm">
            <div><input id="username" placeholder="아이디" autocomplete="username" required></div>
            <div><input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" required></div>
            <button type="submit">로그인</button>
        </form>
        <p class="error" id="loginError"></p>
        <p class="ok hidden" id="sharePendingLogin"></p>
        <p class="hint">계정이 없으면 <a href="/account.html">회원가입</a></p>
    </section>

    <div id="driveBox" class="hidden">
        <p><b id="who"></b> 의 저장소 <button type="button" id="logoutButton">로그아웃</button></p>

        <section>
            <h2>파일 올리기</h2>
            <div id="shareBox" class="hidden">
                <b id="shareTitle"></b>
                <div class="hint" id="shareNames"></div>
                <input id="shareBundleName" placeholder="묶음 이름 (묶어서 올릴 때, 비우면 묶음-날짜-시각)" maxlength="100">
                <div>
                    <button type="button" id="shareSingle">따로따로 올리기</button>
                    <button type="button" id="shareBundle">묶어서 올리기</button>
                    <button type="button" id="shareCancel">버리기</button>
                </div>
            </div>
            <form id="uploadForm">
                <input id="fileInput" type="file" multiple required>
                <button type="submit">업로드</button>
                <div>
                    <label><input type="checkbox" id="bundleCheck"> 묶어서 올리기 (나중에 묶음 다운로드로 한 번에 받기)</label>
                </div>
                <div id="bundleNameBox" class="hidden">
                    <input id="bundleName" placeholder="묶음 이름 (비우면 묶음-날짜-시각)" maxlength="100">
                </div>
            </form>
            <div id="dropZone">여기에 파일을 끌어다 놓아도 됩니다</div>
            <p class="hint">파일 하나 50MB까지, 전체 1GB까지</p>
            <p id="uploadResult"></p>
        </section>

        <section>
            <h2>내 파일 <span class="hint" id="usage"></span></h2>
            <ul id="fileList"></ul>
        </section>
    </div>

    <script>
        const loginBox = document.getElementById("loginBox");
        const driveBox = document.getElementById("driveBox");
        const uploadResult = document.getElementById("uploadResult");

        function size(bytes) {
            if (bytes >= 1073741824) return (bytes / 1073741824).toFixed(2) + " GB";
            if (bytes >= 1048576) return (bytes / 1048576).toFixed(1) + " MB";
            if (bytes >= 1024) return Math.round(bytes / 1024) + " KB";
            return bytes + " B";
        }

        function showResult(text, ok) {
            uploadResult.textContent = text;
            uploadResult.className = ok ? "ok" : "error";
        }

        async function refresh() {
            const response = await fetch("/api/users/me", { cache: "no-store" });
            const loggedIn = response.ok;
            loginBox.classList.toggle("hidden", loggedIn);
            driveBox.classList.toggle("hidden", !loggedIn);
            showShared(loggedIn);
            if (loggedIn) {
                document.getElementById("who").textContent = (await response.json()).username;
                await loadFiles();
            }
        }

        async function loadFiles() {
            const response = await fetch("/api/private/files", { cache: "no-store" });
            if (response.status === 401) return refresh();
            const data = await response.json();

            document.getElementById("usage").textContent =
                `(${size(data.usedBytes)} / ${size(data.quotaBytes)} 사용)`;

            const list = document.getElementById("fileList");
            list.innerHTML = "";
            if (!data.files.length && !data.bundles.length) {
                const li = document.createElement("li");
                li.textContent = "아직 올린 파일이 없습니다.";
                list.append(li);
                return;
            }

            const items = [
                ...data.bundles.map(b => ({ bundle: b, at: b.modifiedAt })),
                ...data.files.map(f => ({ file: f, at: f.modifiedAt }))
            ].sort((a, b) => b.at.localeCompare(a.at));

            for (const item of items) {
                list.append(item.bundle ? bundleRow(item.bundle) : fileRow(item.file, null));
            }
        }

        function when(iso) {
            return new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul" });
        }

        function button(text, onclick) {
            const b = document.createElement("button");
            b.type = "button";
            b.textContent = text;
            b.onclick = onclick;
            return b;
        }

        function infoBox(title, meta) {
            const info = document.createElement("div");
            const name = document.createElement("div");
            name.className = "name";
            name.textContent = title;
            const m = document.createElement("div");
            m.className = "hint";
            m.textContent = meta;
            info.append(name, m);
            return info;
        }

        function fileUrl(f, bundle) {
            return bundle
                ? "/api/private/bundles/download?bundle=" + encodeURIComponent(bundle) + "&name=" + encodeURIComponent(f.name)
                : "/api/private/files/download?name=" + encodeURIComponent(f.name);
        }

        function startDownload(url) {
            const a = document.createElement("a");
            a.href = url;
            a.download = "";
            document.body.append(a);
            a.click();
            a.remove();
        }

        async function remove(url, question) {
            if (!confirm(question)) return;
            const r = await fetch(url, { method: "DELETE" });
            showResult(await r.text(), r.ok);
            loadFiles();
        }

        function fileRow(f, bundle) {
            const li = document.createElement("li");
            const actions = document.createElement("div");
            actions.className = "actions";
            actions.append(button("다운로드", () => startDownload(fileUrl(f, bundle))));
            if (!bundle) {
                actions.append(button("삭제", () => remove(
                    "/api/private/files?name=" + encodeURIComponent(f.name), f.name + " 을(를) 삭제할까요?")));
            }
            li.append(infoBox(f.name, when(f.modifiedAt) + " · " + size(f.size)), actions);
            return li;
        }

        function bundleRow(b) {
            const li = document.createElement("li");
            li.className = "bundle";
            const row = document.createElement("div");
            row.className = "row";
            const inner = document.createElement("ul");
            inner.className = "hidden";
            b.files.forEach(f => inner.append(fileRow(f, b.name)));

            const actions = document.createElement("div");
            actions.className = "actions";
            const all = button("묶음 다운로드", async () => {
                all.disabled = true;
                for (let i = 0; i < b.files.length; i++) {
                    showResult(`${b.name}: ${i + 1}/${b.files.length} 다운로드 중 (${b.files[i].name})`, true);
                    startDownload(fileUrl(b.files[i], b.name));
                    // 브라우저가 연속 다운로드를 하나씩 받도록 간격을 둔다.
                    await new Promise(r => setTimeout(r, 1000));
                }
                showResult(`${b.name}: ${b.files.length}개 파일 다운로드를 시작했습니다. `
                    + "브라우저가 '여러 파일 다운로드'를 물으면 허용해 주세요.", true);
                all.disabled = false;
            });
            // 낱개 다운로드(위)는 그대로 두고, 한 파일로 받고 싶을 때 쓰는 zip.
            const zip = button("ZIP으로 다운받기", () => {
                startDownload("/api/private/bundles/zip?bundle=" + encodeURIComponent(b.name));
                showResult(`${b.name}: ZIP 다운로드를 시작했습니다. 파일이 크면 시작까지 조금 걸릴 수 있어요.`, true);
            });
            const toggle = button("펼치기", () => {
                const open = inner.classList.toggle("hidden");
                toggle.textContent = open ? "펼치기" : "접기";
            });
            actions.append(all, zip, toggle, button("삭제", () => remove(
                "/api/private/bundles?bundle=" + encodeURIComponent(b.name),
                `묶음 '${b.name}' 과 안의 파일 ${b.files.length}개를 모두 삭제할까요?`)));

            row.append(infoBox("📦 " + b.name, `묶음 · ${b.files.length}개 · ${when(b.modifiedAt)} · ${size(b.size)}`), actions);
            li.append(row, inner);
            return li;
        }

        /** bundleName 이 null 이면 따로따로, 문자열이면 묶음으로. 기본값은 화면의 "묶어서 올리기" 체크. 성공하면 true. */
        async function upload(files, bundleName = document.getElementById("bundleCheck").checked
            ? document.getElementById("bundleName").value : null) {
            if (!files.length) return false;
            const form = new FormData();
            for (const f of files) form.append("files", f);
            if (bundleName !== null) {
                form.append("bundle", "true");
                form.append("bundleName", bundleName);
            }
            showResult("업로드 중...", true);
            let ok = false;
            try {
                const r = await fetch("/api/private/files", { method: "POST", body: form });
                const text = await r.text();
                ok = r.ok;
                showResult(r.ok ? text : (r.status === 413 && !text ? "파일이 너무 큽니다(한 번에 50MB까지)." : text || "업로드 실패"), r.ok);
            } catch (e) {
                showResult("업로드 실패: " + e.message, false);
            }
            document.getElementById("fileInput").value = "";
            loadFiles();
            return ok;
        }

        // ── 안드로이드 공유 메뉴로 받은 파일 ──
        // private-sw.js 가 기기 안(IndexedDB)에 넣어 둔 파일을, 로그인된 상태에서 평소 업로드로 올린다.
        function shareDb() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open("private-share", 1);
                req.onupgradeneeded = () => req.result.createObjectStore("pending");
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function sharePending(files) {
            const db = await shareDb();
            return new Promise((resolve, reject) => {
                const tx = db.transaction("pending", files === undefined ? "readonly" : "readwrite");
                const store = tx.objectStore("pending");
                const req = files === undefined ? store.get("files") : store.put(files, "files");
                tx.oncomplete = () => { db.close(); resolve(files === undefined ? (req.result || []) : files); };
                tx.onerror = () => reject(tx.error);
            });
        }

        async function showShared(loggedIn) {
            let files = [];
            try { files = "indexedDB" in window ? await sharePending() : []; } catch (e) { files = []; }
            const box = document.getElementById("shareBox");
            const waiting = document.getElementById("sharePendingLogin");
            box.classList.toggle("hidden", !loggedIn || !files.length);
            waiting.classList.toggle("hidden", loggedIn || !files.length);
            waiting.textContent = `공유받은 파일 ${files.length}개가 기다리고 있어요. 로그인하면 바로 올릴 수 있어요.`;
            if (!files.length) return;
            const total = files.reduce((s, f) => s + f.size, 0);
            document.getElementById("shareTitle").textContent = `📲 공유받은 파일 ${files.length}개 (${size(total)})`;
            document.getElementById("shareNames").textContent =
                files.slice(0, 5).map(f => f.name).join(", ") + (files.length > 5 ? ` 외 ${files.length - 5}개` : "");
            document.getElementById("shareBundle").classList.toggle("hidden", files.length < 2);
            document.getElementById("shareBundleName").classList.toggle("hidden", files.length < 2);
        }

        async function uploadShared(bundled) {
            const files = await sharePending();
            const buttons = document.querySelectorAll("#shareBox button");
            buttons.forEach(b => b.disabled = true);
            const ok = await upload(files, bundled ? document.getElementById("shareBundleName").value : null);
            buttons.forEach(b => b.disabled = false);
            if (ok) {
                await sharePending([]);
                showShared(true);
            }
        }

        document.getElementById("shareSingle").onclick = () => uploadShared(false);
        document.getElementById("shareBundle").onclick = () => uploadShared(true);
        document.getElementById("shareCancel").onclick = async () => {
            if (!confirm("공유받은 파일을 올리지 않고 버릴까요? (휴대폰의 원본은 그대로예요)")) return;
            await sharePending([]);
            showShared(true);
        };

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("/private-sw.js", { scope: "/private" }).catch(() => {});
        }

        // 공유 직후 주소의 표시(?share=…, 서버 대체 경로의 ?shared=…)는 한 번만 읽고 지운다.
        const shareParams = new URLSearchParams(location.search);
        if (shareParams.has("share") || shareParams.has("shared")) {
            history.replaceState(null, "", "/private.html");
            if (shareParams.get("share") === "failed") showResult("공유받은 파일을 읽지 못했어요. 다시 공유해 주세요.", false);
            if (shareParams.get("share") === "login") {
                document.getElementById("loginError").textContent = "로그인이 풀려 있어 공유한 파일을 받지 못했어요. 로그인한 뒤 다시 공유해 주세요.";
            }
            if (shareParams.has("shared")) showResult(`공유한 파일 ${shareParams.get("shared")}개를 내 저장소에 저장했습니다.`, true);
        }

        document.getElementById("loginForm").addEventListener("submit", async event => {
            event.preventDefault();
            const r = await fetch("/api/users/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    username: document.getElementById("username").value,
                    password: document.getElementById("password").value
                })
            });
            document.getElementById("loginError").textContent = r.ok ? "" : await r.text();
            if (r.ok) {
                document.getElementById("password").value = "";
                refresh();
            }
        });

        document.getElementById("logoutButton").onclick = async () => {
            await fetch("/api/users/logout", { method: "POST" });
            refresh();
        };

        document.getElementById("uploadForm").addEventListener("submit", event => {
            event.preventDefault();
            upload(document.getElementById("fileInput").files);
        });

        document.getElementById("bundleCheck").addEventListener("change", e => {
            document.getElementById("bundleNameBox").classList.toggle("hidden", !e.target.checked);
        });

        const dropZone = document.getElementById("dropZone");
        dropZone.addEventListener("dragover", e => { e.preventDefault(); dropZone.classList.add("over"); });
        dropZone.addEventListener("dragleave", () => dropZone.classList.remove("over"));
        dropZone.addEventListener("drop", e => {
            e.preventDefault();
            dropZone.classList.remove("over");
            upload(e.dataTransfer.files);
        });

        refresh();
    </script>
</body>
</html>
