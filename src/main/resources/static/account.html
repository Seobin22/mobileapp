<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneDrop 계정</title>

    <style>
        body {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }

        section {
            margin-bottom: 32px;
        }

        input {
            padding: 6px;
            margin: 4px 0;
        }

        .hint {
            color: #666;
            font-size: 0.9em;
        }

        .error {
            color: #c92a2a;
            min-height: 1.2em;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <h1>PhoneDrop 계정</h1>
    <p><a href="/">메인으로</a></p>

    <div id="guestBox" class="hidden">
        <section>
            <h2>로그인</h2>
            <form id="loginForm">
                <div><input id="loginUsername" placeholder="아이디" autocomplete="username" required></div>
                <div><input id="loginPassword" type="password" placeholder="비밀번호" autocomplete="current-password" required></div>
                <button type="submit">로그인</button>
            </form>
            <p class="error" id="loginError"></p>
        </section>

        <section>
            <h2>회원가입</h2>
            <form id="signupForm">
                <div><input id="signupUsername" placeholder="아이디" autocomplete="username" required></div>
                <div class="hint">영문 소문자로 시작, 소문자·숫자·밑줄(_) 3~20자</div>
                <div><input id="signupPassword" type="password" placeholder="비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required></div>
                <div><input id="signupPassword2" type="password" placeholder="비밀번호 확인" autocomplete="new-password" minlength="8" required></div>
                <button type="submit">가입하기</button>
            </form>
            <p class="error" id="signupError"></p>
        </section>
    </div>

    <div id="userBox" class="hidden">
        <section>
            <h2>내 계정</h2>
            <p><b id="who"></b> 로 로그인됨 <span class="hint" id="since"></span></p>
            <button type="button" onclick="logout()">로그아웃</button>
        </section>

        <section>
            <h2>비밀번호 변경</h2>
            <form id="passwordForm">
                <div><input id="currentPassword" type="password" placeholder="현재 비밀번호" autocomplete="current-password" required></div>
                <div><input id="newPassword" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" minlength="8" required></div>
                <button type="submit">변경</button>
            </form>
            <p class="error" id="passwordError"></p>
        </section>
    </div>

    <script>
        async function api(method, path, body) {
            const options = { method, headers: {} };

            if (body !== undefined) {
                options.headers["Content-Type"] = "application/json";
                options.body = JSON.stringify(body);
            }

            return fetch("/api/users" + path, options);
        }

        async function refresh() {
            const response = await api("GET", "/me");
            const loggedIn = response.ok;

            document.getElementById("guestBox").classList.toggle("hidden", loggedIn);
            document.getElementById("userBox").classList.toggle("hidden", !loggedIn);

            if (loggedIn) {
                const me = await response.json();
                document.getElementById("who").textContent = me.username;
                document.getElementById("since").textContent = "(가입 " + me.createdAt.slice(0, 10) + ")";
            }
        }

        document.getElementById("loginForm").addEventListener("submit", async event => {
            event.preventDefault();

            const response = await api("POST", "/login", {
                username: document.getElementById("loginUsername").value,
                password: document.getElementById("loginPassword").value
            });

            document.getElementById("loginError").textContent = response.ok ? "" : await response.text();

            if (response.ok) {
                document.getElementById("loginPassword").value = "";
                await refresh();
            }
        });

        document.getElementById("signupForm").addEventListener("submit", async event => {
            event.preventDefault();

            const password = document.getElementById("signupPassword").value;
            const error = document.getElementById("signupError");

            if (password !== document.getElementById("signupPassword2").value) {
                error.textContent = "비밀번호 확인이 다릅니다.";
                return;
            }

            const response = await api("POST", "/signup", {
                username: document.getElementById("signupUsername").value,
                password
            });

            error.textContent = response.ok ? "" : await response.text();

            if (response.ok) {
                document.getElementById("signupPassword").value = "";
                document.getElementById("signupPassword2").value = "";
                await refresh();
            }
        });

        document.getElementById("passwordForm").addEventListener("submit", async event => {
            event.preventDefault();

            const response = await api("POST", "/password", {
                currentPassword: document.getElementById("currentPassword").value,
                newPassword: document.getElementById("newPassword").value
            });

            document.getElementById("passwordError").textContent = await response.text();

            if (response.ok) {
                document.getElementById("currentPassword").value = "";
                document.getElementById("newPassword").value = "";
            }
        });

        async function logout() {
            await api("POST", "/logout");
            await refresh();
        }

        refresh();
    </script>
</body>
</html>
