<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhoneDrop</title>

    <style>
        body {
            max-width: 800px;
            margin: 30px auto;
            padding: 0 16px;
            font-family: sans-serif;
        }

        section {
            margin-bottom: 40px;
        }

        #dropZone {
            margin-top: 15px;
            padding: 30px;
            border: 2px dashed #888;
            text-align: center;
        }

        li {
            margin: 10px 0;
        }

        textarea {
            width: 100%;
            min-height: 100px;
        }

        button {
            margin-left: 5px;
        }

        .textItem {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #aaa;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>
    <h1>PhoneDrop</h1>
    <p><a id="accountLink" href="/account.html">로그인 / 회원가입</a></p>
    <p><a href="https://test.seobin.page/">실행 비서 관리</a></p>
    <p><a href="https://check.seobin.page/">파일 아카이브 (Actions 결과물)</a></p>
    <p><a href="https://admin.seobin.page/">관리자 (텍스트 기록)</a></p>

    <section>
        <h2>파일 업로드</h2>

        <form id="uploadForm">
            <input id="fileInput" type="file" multiple required>
            <button type="submit">업로드</button>
        </form>

        <div id="dropZone">
            컴퓨터에서는 여러 파일을 여기에 함께 끌어 놓을 수 있습니다.
        </div>

        <p id="uploadResult"></p>
    </section>

    <section>
        <h2>파일 목록</h2>

        <button type="button" onclick="loadFiles()">
            새로고침
        </button>

        <ul id="fileList"></ul>
    </section>

    <section>
        <h2>텍스트 전송</h2>

        <textarea
            id="textInput"
            placeholder="다른 기기로 보낼 텍스트를 입력하세요."
        ></textarea>

        <br>

        <button type="button" onclick="sendText()">
            텍스트 전송
        </button>

        <p>
            <label>
                날짜
                <input id="textDate" type="date">
            </label>
            <button type="button" onclick="showToday()">오늘</button>
        </p>

        <div id="textList"></div>
    </section>

    <script>
        const uploadForm = document.getElementById("uploadForm");
        const fileInput = document.getElementById("fileInput");
        const dropZone = document.getElementById("dropZone");
        const uploadResult = document.getElementById("uploadResult");

        uploadForm.addEventListener("submit", async event => {
            event.preventDefault();

            const files = fileInput.files;

            if (files.length === 0) {
                return;
            }

            await uploadFiles(files);
        });

        dropZone.addEventListener("dragover", event => {
            event.preventDefault();
        });

        dropZone.addEventListener("drop", async event => {
            event.preventDefault();

            const files = event.dataTransfer.files;

            if (files.length === 0) {
                return;
            }

            await uploadFiles(files);
        });

        async function uploadFiles(files) {
            const formData = new FormData();

            for (const file of files) {
                formData.append("files", file);
            }

            const response = await fetch("/files", {
                method: "POST",
                body: formData
            });

            const message = await response.text();
            uploadResult.textContent = message;

            if (response.ok) {
                fileInput.value = "";
                await loadFiles();
            }
        }

        async function loadFiles() {
            const response = await fetch("/files");
            const files = await response.json();

            const fileList = document.getElementById("fileList");
            fileList.innerHTML = "";

            for (const fileName of files) {
                const item = document.createElement("li");

                const name = document.createElement("span");
                name.textContent = fileName + " ";

                const download = document.createElement("a");
                download.textContent = "다운로드";
                download.href =
                    "/files/download?name=" +
                    encodeURIComponent(fileName);

                const deleteButton = document.createElement("button");
                deleteButton.textContent = "삭제";
                deleteButton.addEventListener("click", async () => {
                    await deleteFile(fileName);
                });

                item.append(name, download, deleteButton);
                fileList.appendChild(item);
            }
        }

        async function deleteFile(fileName) {
            const confirmed = confirm(
                fileName + " 파일을 삭제할까요?"
            );

            if (!confirmed) {
                return;
            }

            const response = await fetch(
                "/files?name=" + encodeURIComponent(fileName),
                {
                    method: "DELETE"
                }
            );

            const message = await response.text();
            alert(message);

            if (response.ok) {
                await loadFiles();
            }
        }

        async function sendText() {
            const textInput = document.getElementById("textInput");
            const text = textInput.value;

            const response = await fetch("/texts", {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain; charset=UTF-8"
                },
                body: text
            });

            const message = await response.text();

            if (!response.ok) {
                alert(message);
                return;
            }

            textInput.value = "";
            await loadTexts();
        }

        const textDate = document.getElementById("textDate");

        // 날짜를 직접 고르지 않았으면 자정이 지나도 계속 오늘(한국 시간)을 보여준다.
        let datePicked = false;

        function todayInKorea() {
            return new Date().toLocaleDateString("sv-SE", {
                timeZone: "Asia/Seoul"
            });
        }

        textDate.addEventListener("change", async () => {
            datePicked = textDate.value !== "";
            await loadTexts();
        });

        async function showToday() {
            datePicked = false;
            await loadTexts();
        }

        async function loadTexts() {
            if (!datePicked) {
                textDate.value = todayInKorea();
            }

            const response = await fetch(
                "/texts?date=" + encodeURIComponent(textDate.value)
            );
            const texts = await response.json();

            const textList = document.getElementById("textList");
            textList.innerHTML = "";

            if (texts.length === 0) {
                textList.textContent = "이 날짜에 보낸 텍스트가 없습니다.";
                return;
            }

            texts.forEach(entry => {
                const item = document.createElement("div");
                item.className = "textItem";

                const time = document.createElement("small");
                time.textContent = entry.createdAt.slice(11, 16);

                const content = document.createElement("div");
                content.textContent = entry.text;

                const copyButton = document.createElement("button");
                copyButton.textContent = "복사";
                copyButton.addEventListener("click", async () => {
                    await navigator.clipboard.writeText(entry.text);
                    alert("복사했습니다.");
                });

                item.append(time, content, copyButton);
                textList.appendChild(item);
            });
        }

        async function loadAccount() {
            const response = await fetch("/api/users/me");

            if (response.ok) {
                const me = await response.json();
                document.getElementById("accountLink").textContent =
                    me.username + " 로그인됨 (내 계정)";
            }
        }

        loadAccount();
        loadFiles();
        loadTexts();

        setInterval(() => {
            loadFiles();
            loadTexts();
        }, 3000);
    </script>
</body>
</html>
