spring.application.name=phonedrop
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# 실행 비서(assistant). 데이터는 상대경로 data/assistant/ (서버에서는 /root/data/assistant/)
spring.datasource.url=jdbc:h2:file:./data/assistant/assistant;NON_KEYWORDS=KEY,VALUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
assistant.data-dir=data/assistant
# 비밀값은 여기 넣지 않는다. 환경변수 ASSISTANT_API_TOKEN 이 없으면 data/assistant/api_token 을 자동 생성한다.
assistant.api-token=${ASSISTANT_API_TOKEN:}
# fake | firebase. firebase 이면 ASSISTANT_FIREBASE_CREDENTIALS 에 서비스 계정 키 경로.
assistant.push-mode=${ASSISTANT_PUSH_MODE:fake}
assistant.firebase-credentials=${ASSISTANT_FIREBASE_CREDENTIALS:}
assistant.worker.poll-ms=1000
# 채팅 비서 모델(빌드문서 v2 §1). 사용자가 claude-sonnet-5-5 로 정했다(2026-10-29). 환경변수 AGENT_MODEL 로 바꿀 수 있다.
assistant.agent-model=${AGENT_MODEL:claude-sonnet-5-5}
